name: Evergreen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: evergreen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    name: lifecycle scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for lifecycle risks
        uses: arminazimi/evergreen@v0.7.2
        with:
          baseline: .evergreen-baseline.json
          fail-on-severity: high
