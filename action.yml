# Seaworthy verification as a composite GitHub Action (issue #88).
#
# Minimal usage (after actions/checkout has the site sources):
#   uses: arminazimi/seaworthy@<commit-sha>   # pre-alpha: consume by commit pin; there is no version tag yet
#   with:
#     sarif: seaworthy.sarif
#
# Several sites in one repository: list their built folders on the `site` input, one per line
# or comma; each gets its own verify run and its own SARIF file, and the run fails if any site
# fails. Build every folder in your own steps first — the Action only verifies, never builds.
#
# The Action runs with the pre-release CLI built from source, since
# @seaworthy/verify is not published yet; the build step runs `npm ci` inside
# the Action's own checkout (GITHUB_ACTION_PATH), never in the consumer's
# workspace. Action pins use the same tag pins as .github/workflows/ci.yml.
name: Verify a site with Seaworthy
description: Verifies one or several built sites, writes an optional SARIF 2.1.0 report per site, and fails at the threshold.
inputs:
  site:
    description: Built site folder, relative to the workspace — or several, one per line or comma, for a repository that builds more than one site. Each named folder gets its own verify run, and building every folder stays the caller's own steps. Default lets the CLI pick the first existing of dist, build, out, public, _site, site.
    required: false
    default: ""
  threshold:
    description: Severity that fails the run — error (default), warning, note, or none.
    required: false
    default: error
  sarif:
    description: Where to write the SARIF 2.1.0 report, relative to the workspace. Default disables SARIF.
    required: false
    default: ""
  markdown:
    description: Markdown files or folders for the Markdown checks, relative to the workspace, one per line or comma. Default lets those checks walk the built site folder.
    required: false
    default: ""
outputs:
  sarif:
    description: The SARIF file path as given for one site; one path per line when several sites were verified; "" when the sarif input was empty.
    value: ${{ steps.verify.outputs.sarif }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build Seaworthy from source
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        npm ci
        npm run build --silent
    - name: Verify the site
      id: verify
      shell: bash
      env:
        SEAWORTHY_SITE: ${{ inputs.site }}
        SEAWORTHY_THRESHOLD: ${{ inputs.threshold }}
        SEAWORTHY_SARIF: ${{ inputs.sarif }}
        SEAWORTHY_MARKDOWN: ${{ inputs.markdown }}
      # run.js reads the inputs from these SEAWORTHY_* variables and verifies every site named
      # by `site` as its own run (cwd: the consumer's workspace) — one site's failure never hides
      # another's findings, and a crash stays exit 4. The run exits with the verify contract
      # (0 ok, 1 when any site fails at the threshold, 2 when one was rejected, 4 when one
      # crashed) and writes one SARIF file per site when asked.
      run: node "$GITHUB_ACTION_PATH/packages/action/dist/run.js"
    # Slot for the PR comment with new and fixed findings (issue #89): it reads the
    # SARIF from steps.verify.outputs.sarif and runs after this step, any() condition
    # of its own.
    - name: Upload the SARIF report
      if: always() && steps.verify.outputs.sarif != ''
      uses: actions/upload-artifact@v4
      with:
        name: seaworthy-sarif
        path: ${{ steps.verify.outputs.sarif }}
