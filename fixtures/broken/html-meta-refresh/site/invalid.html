<!doctype html>
<html lang="en">
<head>
  <title>Refresh values browsers ignore</title>
  <meta http-equiv="refresh">
  <meta http-equiv="refresh" content="">
  <meta http-equiv="refresh" content="soon; url=index.html">
  <meta http-equiv="refresh" content="+5; url=index.html">
  <meta http-equiv="refresh" content="0.5; url=index.html">
  <meta http-equiv="X-UA-Compatible" content="5">
  <meta name="refresh" content="5">
</head>
<body><h1>No timed refresh here</h1></body>
</html>
