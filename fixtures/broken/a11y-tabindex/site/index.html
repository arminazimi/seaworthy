<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tabindex</title>
</head>
<body>
<a href="#main" tabindex="1">Skip</a>
<button tabindex="3">Jumps the queue</button>
<div tabindex="0">Focusable in place</div>
<div tabindex="-1">Focusable by script only</div>
<input tabindex="+2" aria-label="Search">
<span tabindex="abc">Not a number</span>
</body>
</html>
