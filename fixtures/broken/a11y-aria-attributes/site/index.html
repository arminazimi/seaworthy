<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ARIA attributes</title>
</head>
<body>
<main>
<h1>ARIA attributes</h1>
<button aria-lable="Search">Find</button>
<button aria-expanded="yes" aria-controls="menu">Menu</button>
<ul id="menu"><li>One</li></ul>
<button aria-pressed="True">Toggle</button>
<div aria-live="loud">News</div>
<div role="heading" aria-level="0">Section</div>
<div role="heading" aria-level="2">Second section</div>
<button aria-haspopup="menu" aria-current="page" aria-label="">OK</button>
<div role="progressbar" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100"></div>
</main>
</body>
</html>
